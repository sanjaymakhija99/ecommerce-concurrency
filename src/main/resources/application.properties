spring.application.name=ecommerce-concurrency
server.port=8080

# Java 21 virtual threads for Tomcat request handling
spring.threads.virtual.enabled=true

# Show thread name + requestId (MDC) in every log line
logging.pattern.console=%d{HH:mm:ss.SSS} [%-22thread] [%X{requestId:-none}] %-5level %logger{20} - %msg%n

# Custom executor settings
app.executor.notification.core-size=2
app.executor.notification.max-size=4
app.executor.notification.queue-capacity=100
app.executor.report.core-size=4
app.executor.report.max-size=8
app.executor.report.queue-capacity=50
app.flash-sale.max-concurrent=5
